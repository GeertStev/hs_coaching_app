name: hs_coaching_app
description: "Holy Squid coaching app"
publish_to: 'none'
version: 0.1.0+3

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.1.0
  flutter_riverpod: ^3.0.0
  firebase_auth: ^6.0.2
  cloud_firestore: ^6.0.1
  firebase_storage: ^13.0.2
  firebase_messaging: ^16.0.1
  json_annotation: ^4.9.0
  freezed_annotation: ^3.1.0
  perfect_freehand: ^2.5.0
  intl: ^0.20.2
  image_picker: ^1.2.0
  image_cropper: ^12.2.1
  riverpod: ^3.0.3
  change_app_package_name: ^1.5.0
  flutter_svg: ^2.3.0
  file_picker: ^11.0.2
  uuid: ^4.6.0
  http: ^1.6.0
  shared_preferences: ^2.3.3
  hs_coaching_core:
    path: ../hs_coaching_core
  firebase_database: ^12.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  custom_lint: ^0.8.0
  riverpod_lint: ^3.0.0
  json_serializable: ^6.11.1
  build_runner: ^2.7.1
  freezed: ^3.2.3

flutter:
  uses-material-design: true

  assets:
    - assets/

  fonts:
    - family: Anybody
      fonts:
        - asset: assets/google_fonts/Anybody/Anybody-SemiBold.ttf
          weight: 600
        - asset: assets/google_fonts/Anybody/Anybody-Bold.ttf
          weight: 700
        - asset: assets/google_fonts/Anybody/Anybody-ExtraBold.ttf
          weight: 800
    - family: Hanken Grotesk
      fonts:
        - asset: assets/google_fonts/Hanken_Grotesk/HankenGrotesk-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/Hanken_Grotesk/HankenGrotesk-Medium.ttf
          weight: 500
    - family: JetBrains Mono
      fonts:
        - asset: assets/google_fonts/JetBrainsMono/JetBrainsMono-SemiBold.ttf
          weight: 600
        - asset: assets/google_fonts/JetBrainsMono/JetBrainsMono-Bold.ttf
          weight: 700
