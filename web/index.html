<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Vaste base href: de app draait op de webserver onder /HSA/ (het scherm onder /HSC/). -->
  <base href="/HSA/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Holy Squid Coaching: create content and push it live to the pool screen">
  <meta name="theme-color" content="#121414">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="HS Coach">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico"/>

  <title>Holy Squid Coaching</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Laadscherm tot Flutter het eerste frame tekent. */
    html, body { margin: 0; height: 100%; background: #121414; }
    #splash {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #121414;
      transition: opacity 300ms ease-out;
    }
    #splash img { width: 128px; height: 128px; animation: pulse 1.6s ease-in-out infinite; }
    #splash.hidden { opacity: 0; pointer-events: none; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
  </style>
</head>
<body>
  <div id="splash"><img src="icons/icon-192.png" alt="Holy Squid"></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('hidden');
      setTimeout(function () { splash.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
